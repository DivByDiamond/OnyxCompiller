name: OnyxCompiller CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: DivByDiamond/OnyxKernel
          path: OnyxKernel

      - name: Check syscall ABI snapshot
        run: python3 OnyxKernel/scripts/generate-syscalls.py --check --compiler-dir .

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential ccache

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build
            libonyxc/build
          key: onyxcc-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'libonyxc/**', 'CMakeLists.txt', 'Makefile') }}
          restore-keys: onyxcc-${{ runner.os }}-

      - name: Build host tools from source
        # Prebuilt executables are tracked; checkout mtimes cannot establish
        # that they correspond to the current source or syscall snapshot.
        run: make -B -j$(nproc) all tools/onx-run

      - name: Frontend, target runtime and driver checks
        run: make check

      - name: Native allocator and libc sanitizer checks
        run: make check-native

      - name: Self-hosting test (compile own sources)
        run: make selfhost-test

      - name: Experimental self-hosted artifact build
        run: make selfhost

      - name: Upload experimental onyxcc_self.onx
        uses: actions/upload-artifact@v6
        with:
          name: onyxcc_self
          path: onyxcc_self.onx
