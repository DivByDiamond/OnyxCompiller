name: OnyxCompiller CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential ccache

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build
            libonyxc/build
          key: onyxcc-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'libonyxc/**', 'CMakeLists.txt', 'Makefile') }}
          restore-keys: onyxcc-${{ runner.os }}-

      - name: Build host onyxcc
        run: make -j$(nproc)

      - name: Self-hosting test (compile own sources)
        run: make selfhost-test

      - name: Self-hosting full build
        run: make selfhost

      - name: Upload onyxcc_self.onx
        uses: actions/upload-artifact@v6
        with:
          name: onyxcc_self
          path: onyxcc_self.onx
